<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>翻译</title>
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #fff;
    color: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  body::before {
    content: '';
    flex: none;
    max-height: 25vh;
  }

  #editor {
    scrollbar-width: none;
    -ms-overflow-style: none;
    width: 100%;
    max-width: 760px;
    max-height: 100vh;
    overflow-y: auto;
    padding: 40px 32px;
    outline: none;
    font-size: 20px;
    line-height: 2.1;
    caret-color: #111;
    white-space: pre-wrap;
    word-break: break-word;
    text-align: left;
  }
  #editor::-webkit-scrollbar { display: none; }
  #editor:empty::before {
    content: attr(data-placeholder);
    color: #c4c4c4;
  }

  ruby {
    ruby-align: start;
    border-radius: 4px;
    transition: background .12s;
  }
  rt {
    ruby-position: under;
    -webkit-ruby-position: after;
    font-size: 13px;
    color: #9a9a9a;
    padding-top: 2px;
    pointer-events: none;
    user-select: none;
  }
  rt::after { content: attr(data-zh); }
  ruby:hover { background: #eef3ff; }
  ruby:hover rt { color: #3a56d4; }

  #links {
    position: fixed;
    right: 14px;
    bottom: 10px;
    font-size: 12px;
    user-select: none;
  }
  #links a {
    color: #bbb;
    text-decoration: none;
    margin-left: 12px;
    transition: color .15s;
  }
  #links a:hover { color: #3a56d4; }

  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #overlay.show { display: flex; }
  #edit-box {
    width: 88%;
    max-width: 760px;
    min-height: 55vh;
    font-size: 24px;
    line-height: 1.9;
    outline: none;
    white-space: pre-wrap;
    word-break: break-word;
    caret-color: #3a56d4;
    text-align: left;
  }

  #history-btn {
    position: fixed;
    left: 14px;
    top: 10px;
    font-size: 12px;
    color: #bbb;
    background: none;
    border: none;
    padding: 4px 6px;
    cursor: pointer;
    user-select: none;
    transition: color .15s;
    z-index: 20;
    font-family: inherit;
  }
  #history-btn:hover { color: #3a56d4; }

  #history-panel {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    width: 320px;
    max-width: 85vw;
    background: #fff;
    border-right: 1px solid #eee;
    box-shadow: 8px 0 32px rgba(0,0,0,.06);
    transform: translateX(-100%);
    transition: transform .22s ease;
    z-index: 30;
    display: flex;
    flex-direction: column;
  }
  #history-panel.open { transform: translateX(0); }
  #history-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 10px;
    font-size: 14px;
    color: #666;
    border-bottom: 1px solid #f0f0f0;
    flex: none;
  }
  #history-close {
    cursor: pointer;
    color: #bbb;
    font-size: 18px;
    line-height: 1;
    padding: 2px 6px;
  }
  #history-close:hover { color: #3a56d4; }
  #history-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .history-empty {
    color: #c4c4c4;
    font-size: 13px;
    text-align: center;
    padding: 32px 0;
  }
  .history-item {
    padding: 10px 16px;
    cursor: pointer;
    transition: background .12s;
  }
  .history-item:hover { background: #f5f7ff; }
  .history-item .h-text {
    font-size: 14px;
    line-height: 1.6;
    color: #333;
    white-space: pre-wrap;
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .history-item .h-time {
    font-size: 11px;
    color: #bbb;
    margin-top: 4px;
  }
  .history-item .h-time.copied { color: #3a56d4; }
</style>
</head>
<body>
<div id="editor" contenteditable="true" spellcheck="false" data-placeholder="输入英文，按回车翻译"></div>
<div id="links">
  <a href="https://github.com/IIIStudio/Translator" target="_blank">GitHub</a>
  <a href="https://cnb.cool/IIIStudio/Code/HTML/Translator" target="_blank">CNB</a>
</div>

<div id="overlay"><div id="edit-box" contenteditable="true" spellcheck="false"></div></div>

<button id="history-btn">历史</button>
<aside id="history-panel">
  <div id="history-head">
    <span>历史记录</span>
    <span id="history-close">×</span>
  </div>
  <div id="history-list"></div>
</aside>

<script>
const editor = document.getElementById('editor');
let busy = false;
let editing = null; // 弹窗编辑中的 ruby 元素

// 不持久化：防止浏览器会话恢复还原 contenteditable 内容
editor.innerHTML = '';

const ABBR = new Set([
  'mr','mrs','ms','dr','st','vs','etc','no','fig','approx','prof','sr','jr',
  'inc','ltd','co','corp','dept','est','vol','pp','ed','rev','gen','gov','sen','rep',
  'jan','feb','mar','apr','jun','jul','aug','sep','sept','oct','nov','dec',
  'mon','tue','tues','wed','thu','thur','thurs','fri','sat','sun',
  'e.g','i.e','a.m','p.m','u.s','u.k','u.n',
]);
const isDigit = c => !!c && c >= '0' && c <= '9';
const isLetter = c => !!c && /[a-zA-Z]/.test(c);

function splitKeep(text) {
  const segs = [];
  let last = 0;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];

    if (c === ',' || c === '，') {
      if (c === ',' && isDigit(text[i - 1]) && isDigit(text[i + 1])) continue;
      segs.push(text.slice(last, i + 1));
      last = i + 1;
      continue;
    }

    if (c === '。') {
      segs.push(text.slice(last, i + 1));
      last = i + 1;
      continue;
    }

    if (c === '.') {
      const next = text[i + 1];
      const CLOSERS = '"\'’”)]}';
      let end = i + 1;
      while (end < text.length && CLOSERS.includes(text[end])) end++;
      let j = i - 1;
      while (j >= 0 && CLOSERS.includes(text[j])) j--;
      const prevCh = j >= 0 ? text[j] : '';
      const nextCh = text[end];

      if (isDigit(prevCh) && isDigit(nextCh)) continue;
      if (prevCh === '.' || nextCh === '.') continue;
      if (isLetter(nextCh)) continue;

      let k = j, word = '';
      while (k >= 0 && (isLetter(text[k]) || text[k] === '.')) { word = text[k] + word; k--; }
      if (word) {
        if (word.includes('.')) continue;
        if (word.length === 1) continue;
        if (ABBR.has(word.toLowerCase())) continue;
      }
      segs.push(text.slice(last, end));
      last = end;
    }
  }

  if (last < text.length) segs.push(text.slice(last));
  return segs;
}

async function translateOne(sentence, pair) {
  const q = sentence.replace(/[,，.。]\s*$/, '');
  const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(q) + '&langpair=' + (pair || 'en|zh');
  const res = await fetch(url, { method: 'GET' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  const t = data && data.responseData && data.responseData.translatedText
    ? data.responseData.translatedText : '';
  if (!t) throw new Error('空结果');
  return t;
}

async function runWithConcurrency(items, limit, worker) {
  let idx = 0;
  async function runner() {
    while (true) {
      const i = idx++;
      if (i >= items.length) break;
      await worker(items[i], i);
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, runner));
}

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function saveCaret() {
  const sel = window.getSelection();
  if (!sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  if (!editor.contains(r.startContainer)) return null;
  const pre = document.createRange();
  pre.selectNodeContents(editor);
  pre.setEnd(r.startContainer, r.startOffset);
  return pre.toString().length;
}

function restoreCaret(offset) {
  if (offset == null) return;
  const sel = window.getSelection();
  const range = document.createRange();
  const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
  let node, acc = 0;
  while ((node = walker.nextNode())) {
    const len = node.nodeValue.length;
    if (acc + len >= offset) {
      range.setStart(node, offset - acc);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
      return;
    }
    acc += len;
  }
  range.selectNodeContents(editor);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);
}

const MAX_HISTORY = 100;
let history = [];
let hIndex = -1;
let histTimer = null;

function pushHistory() {
  clearTimeout(histTimer);
  const snap = { html: editor.innerHTML, caret: saveCaret() };
  if (history[hIndex] && history[hIndex].html === snap.html) return;
  history = history.slice(0, hIndex + 1);
  history.push(snap);
  if (history.length > MAX_HISTORY) history.shift();
  hIndex = history.length - 1;
}

function schedulePush() {
  clearTimeout(histTimer);
  histTimer = setTimeout(pushHistory, 400);
}

function undo() {
  if (busy || editing || hIndex <= 0) return;
  hIndex--;
  const snap = history[hIndex];
  editor.innerHTML = snap.html;
  restoreCaret(snap.caret);
  editor.focus();
}

function redo() {
  if (busy || editing || hIndex >= history.length - 1) return;
  hIndex++;
  const snap = history[hIndex];
  editor.innerHTML = snap.html;
  restoreCaret(snap.caret);
  editor.focus();
}

async function translate() {
  if (busy) return;
  busy = true;

  const jobs = [];
  editor.querySelectorAll('ruby').forEach(ruby => {
    const rt = ruby.querySelector('rt');
    if (!rt && ruby.innerText.trim()) {
      jobs.push({ en: ruby.innerText, oldRt: null, ruby });
    }
  });

  const wrapJobs = [];
  const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
  const textNodes = [];
  while (walker.nextNode()) textNodes.push(walker.currentNode);
  textNodes.forEach(node => {
    if (node.parentElement.closest('ruby')) return;
    const segs = splitKeep(node.nodeValue);
    if (segs.length < 2 && !segs[0].trim()) return;
    if (!segs.some(s => s.trim())) return;
    wrapJobs.push({ node, segs });
  });

  if (!jobs.length && !wrapJobs.length) { busy = false; return; }

  recordInput(editor.innerText, '输入');

  const caretOffset = saveCaret();
  editor.contentEditable = 'false';

  wrapJobs.forEach(({ node, segs }) => {
    const frag = document.createDocumentFragment();
    segs.forEach(s => {
      if (!s.trim()) { frag.appendChild(document.createTextNode(s)); return; }
      const m = s.match(/^(\s*)([\s\S]*?)(\s*)$/);
      if (m[1]) frag.appendChild(document.createTextNode(m[1]));
      const ruby = document.createElement('ruby');
      ruby.textContent = m[2];
      const rt = document.createElement('rt');
      rt.setAttribute('data-zh', '…');
      ruby.appendChild(rt);
      frag.appendChild(ruby);
      if (m[3]) frag.appendChild(document.createTextNode(m[3]));
      jobs.push({ en: m[2], rt });
    });
    node.parentNode.replaceChild(frag, node);
  });

  jobs.forEach(j => {
    if (j.ruby && !j.rt) {
      const rt = document.createElement('rt');
      rt.setAttribute('data-zh', '…');
      j.ruby.appendChild(rt);
      j.rt = rt;
    }
  });

  await runWithConcurrency(jobs, 4, async (j) => {
    if (!j.rt.isConnected) return;
    try {
      j.rt.setAttribute('data-zh', await translateOne(j.en));
    } catch (err) {
      j.rt.setAttribute('data-zh', '翻译失败');
    }
  });

  busy = false;
  editor.contentEditable = 'true';
  editor.focus();
  restoreCaret(caretOffset);
  pushHistory();
}

const mo = new MutationObserver((mutations) => {
  if (busy || editing) return;
  for (const m of mutations) {
    if (m.type !== 'characterData') continue;
    const parent = m.target.parentElement;
    const ruby = parent && parent.closest('ruby');
    if (ruby) {
      const rt = ruby.querySelector('rt');
      if (rt) rt.remove();
    }
  }
});
mo.observe(editor, { characterData: true, subtree: true });

function reset() {
  if (editing) closeEdit();
  recordInput(editor.innerText, '清空');
  editor.innerHTML = '';
  busy = false;
  editor.contentEditable = 'true';
  editor.focus();
  pushHistory();
}

function rubyText(ruby) {
  let s = '';
  for (const n of ruby.childNodes) {
    if (n.nodeType === Node.TEXT_NODE) s += n.nodeValue;
  }
  return s;
}

function focusAfter(node) {
  if (editing) return;
  editor.focus();
  const sel = window.getSelection();
  const range = document.createRange();
  if (node && node.parentNode) {
    range.setStartAfter(node);
    range.collapse(true);
  } else {
    range.selectNodeContents(editor);
    range.collapse(false);
  }
  sel.removeAllRanges();
  sel.addRange(range);
}

function restoreRuby(ruby, text, zh) {
  ruby.textContent = '';
  ruby.appendChild(document.createTextNode(text));
  const rt = document.createElement('rt');
  if (zh) rt.setAttribute('data-zh', zh);
  ruby.appendChild(rt);
}

async function commitRuby(ruby, raw, origText, origZh, suffix) {
  if (!raw) {
    const anchor = ruby.nextSibling;
    ruby.remove();
    focusAfter(anchor);
    pushHistory();
    return;
  }
  const hasZh = /[\u3400-\u9fff\uf900-\ufaff]/.test(raw);
  let en = raw, zhInput = '';
  if (hasZh) {
    try {
      en = await translateOne(raw, 'zh|en');
      zhInput = raw;
    } catch (err) {
      restoreRuby(ruby, origText, origZh);
      const rt = ruby.querySelector('rt');
      if (rt) rt.setAttribute('data-zh', '翻译失败');
      focusAfter(ruby);
      pushHistory();
      return;
    }
  }
  ruby.textContent = '';
  ruby.appendChild(document.createTextNode(en + (suffix || '')));
  const rt = document.createElement('rt');
  ruby.appendChild(rt);
  if (zhInput) {
    rt.setAttribute('data-zh', zhInput);
  } else {
    rt.setAttribute('data-zh', '…');
    try {
      rt.setAttribute('data-zh', await translateOne(en, 'en|zh'));
    } catch (err) {
      rt.setAttribute('data-zh', '翻译失败');
    }
  }
  focusAfter(ruby);
  pushHistory();
}

const overlay = document.getElementById('overlay');
const editBox = document.getElementById('edit-box');

function openEdit(ruby) {
  if (editing || busy) return;
  editing = ruby;
  editBox.textContent = rubyText(ruby).replace(/[\s,，.。]+$/, '');
  overlay.classList.add('show');
  editBox.focus();
  const sel = window.getSelection();
  const range = document.createRange();
  range.selectNodeContents(editBox);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);
}

function closeEdit() {
  overlay.classList.remove('show');
  editBox.textContent = '';
  editing = null;
  editor.focus();
}

function confirmEdit() {
  if (!editing) return;
  const ruby = editing;
  const raw = editBox.innerText.trim();
  const origText = rubyText(ruby);
  const m = origText.match(/[\s,，.。]+$/);
  const suffix = m ? m[0] : '';
  const rt = ruby.querySelector('rt');
  const origZh = rt ? (rt.getAttribute('data-zh') || '') : '';
  if (raw) recordInput(raw, '修改');
  else recordInput(origText, '删除');
  closeEdit();
  commitRuby(ruby, raw, origText, origZh, suffix);
}

editor.addEventListener('dblclick', (e) => {
  const ruby = e.target.closest && e.target.closest('ruby');
  if (!ruby || busy || editing) return;
  e.preventDefault();
  openEdit(ruby);
});

editBox.addEventListener('keydown', (e) => {
  if (e.isComposing) return;
  if (e.key === 'Enter') {
    e.preventDefault();
    confirmEdit();
  } else if (e.key === 'Escape') {
    e.preventDefault();
    closeEdit();
  }
});

overlay.addEventListener('mousedown', (e) => {
  if (e.target === overlay) {
    e.preventDefault();
    editBox.focus();
  }
});

const histBtn = document.getElementById('history-btn');
const histPanel = document.getElementById('history-panel');
const histClose = document.getElementById('history-close');
const histList = document.getElementById('history-list');
let inputHistory = []; // 仅内存，刷新即清空

function fmtTime(d) {
  return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}

function recordInput(text, type) {
  text = (text || '').trim();
  if (!text) return;
  const top = inputHistory[0];
  if (top && top.text === text && top.type === type) {
    top.time = new Date();
  } else {
    inputHistory.unshift({ text, time: new Date(), type: type || '输入' });
    if (inputHistory.length > 200) inputHistory.pop();
  }
  renderHistory();
}

function renderHistory() {
  histList.innerHTML = '';
  if (!inputHistory.length) {
    const empty = document.createElement('div');
    empty.className = 'history-empty';
    empty.textContent = '暂无历史记录';
    histList.appendChild(empty);
    return;
  }
  inputHistory.forEach(h => {
    const item = document.createElement('div');
    item.className = 'history-item';
    const txt = document.createElement('div');
    txt.className = 'h-text';
    txt.textContent = h.text;
    const time = document.createElement('div');
    time.className = 'h-time';
    time.textContent = fmtTime(h.time) + ' · ' + h.type + ' · 点击复制';
    item.appendChild(txt);
    item.appendChild(time);
    item.addEventListener('click', () => {
      copyText(h.text, () => {
        time.textContent = fmtTime(h.time) + ' · 已复制';
        time.classList.add('copied');
        setTimeout(() => {
          time.textContent = fmtTime(h.time) + ' · ' + h.type + ' · 点击复制';
          time.classList.remove('copied');
        }, 1200);
      });
    });
    histList.appendChild(item);
  });
}

function copyText(text, done) {
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done && done(); } catch (err) {}
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => done && done()).catch(fallback);
  } else {
    fallback();
  }
}

histBtn.addEventListener('click', () => {
  histPanel.classList.toggle('open');
  editor.focus();
});
histClose.addEventListener('click', () => histPanel.classList.remove('open'));

function pasteAsPlain(e) {
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData('text/plain');
  if (text) document.execCommand('insertText', false, text);
}
editor.addEventListener('paste', pasteAsPlain);
editBox.addEventListener('paste', pasteAsPlain);

editor.addEventListener('input', schedulePush);

editor.addEventListener('keydown', (e) => {
  if (e.isComposing) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && (e.key === 'z' || e.key === 'Z')) {
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
    return;
  }
  if (mod && (e.key === 'y' || e.key === 'Y')) {
    e.preventDefault();
    redo();
    return;
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    if (e.shiftKey) {
      document.execCommand('insertLineBreak');
    } else {
      translate();
    }
  } else if (e.key === 'Escape') {
    e.preventDefault();
    if (histPanel.classList.contains('open')) histPanel.classList.remove('open');
    else reset();
  }
});

editor.focus();
pushHistory();
renderHistory();

// 后退/前进（bfcache）恢复页面时也清空
window.addEventListener('pageshow', (e) => {
  if (e.persisted) reset();
});
</script>
</body>
</html>
